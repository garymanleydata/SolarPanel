name: Solar Telemetry Ingestion Pipeline

on:
  schedule:
    # Runs at minute 15 of every hour
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI at any time

# Explicit permission to commit data back into the repository
permissions:
  contents: write

jobs:
  sync-solar-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches pip packages based on requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestion Pipeline
        env:
          FOX_API_KEY: ${{ secrets.FOX_API_KEY }}
          FOX_DEVICE_SN: ${{ secrets.FOX_DEVICE_SN }}
        run: |
          python pipeline_sync.py

      - name: Commit and push updated telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/silver/telemetry_5min.json
          
          # Check whether changes were actually staged before committing
          if git diff --staged --quiet; then
            echo "No new telemetry points to commit."
          else
            git commit -m "chore(telemetry): append continuous 5-minute solar data [skip ci]"
            git push
          fi