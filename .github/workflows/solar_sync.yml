name: Solar Telemetry Ingestion Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-solar-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestion Pipeline
        env:
          FOX_API_KEY: ${{ secrets.FOX_API_KEY }}
          FOX_DEVICE_SN: ${{ secrets.FOX_DEVICE_SN }}
        run: |
          python pipeline_sync.py

      - name: Commit and push updated telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/silver/telemetry_5min.json
          
          if git diff --staged --quiet; then
            echo "No new telemetry points to commit."
          else
            # Plain commit message without [skip ci] so the cron scheduler remains active
            git commit -m "chore(telemetry): append continuous 5-minute solar data"
            git push
          fi

      - name: Send Healthchecks Heartbeat
        if: success()
        run: |
          curl -m 10 --retry 3 https://hc-ping.com/72d1a5bc-582f-493e-8dbe-990765207604